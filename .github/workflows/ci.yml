name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ubuntu-latest
    runs-on: ubuntu-latest

    env:
      # Fail fast on an SDL_assert() rather than waiting for a response.
      SDL_ASSERT: abort

    steps:
      - uses: actions/checkout@v7

      # The tests are written with SDL_assert(), which compiles out at SDL's
      # default assert level in optimized builds, so build Debug to run them.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure
